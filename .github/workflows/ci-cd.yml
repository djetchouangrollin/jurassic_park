name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Build Backend
      - name: Build Backend
        working-directory: backend
        run: |
          npm install
          npm run build
          npm run test:coverage
          npm run docker:build

      # Build Frontend
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm run docker:build

      # Push Docker Images
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Docker Image
        working-directory: backend
        run: |
          docker tag jurassic-park/backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/jurassic-park-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jurassic-park-backend:latest

      - name: Push Frontend Docker Image
        working-directory: frontend
        run: |
          docker tag jurassic-park/frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/jurassic-park-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jurassic-park-frontend:latest

      # Scan de sécurité
      - name: Scan de sécurité avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'template'
          template: '@columns'
          ignore-unfixed: true

      # Déploiement Kubernetes
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to EKS
        uses: azure/k8s-deploy@v1
        with:
          kubernetes-context: ${{ secrets.AWS_EKS_CLUSTER_NAME }}
          namespace: jurassic-park
          manifests: |
            k8s/deployments/backend-deployment.yaml
            k8s/deployments/frontend-deployment.yaml
            k8s/deployments/mysql-deployment.yaml
            k8s/services/backend-service.yaml
            k8s/services/frontend-service.yaml
            k8s/services/mysql-service.yaml
            k8s/storage/mysql-pvc.yaml
          images: |
            ${{ secrets.AWS_ECR_REGISTRY }}/jurassic-park-backend:latest
            ${{ secrets.AWS_ECR_REGISTRY }}/jurassic-park-frontend:latest
